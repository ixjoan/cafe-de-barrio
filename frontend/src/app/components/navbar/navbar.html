<nav class="navbar">
  <a routerLink="/catalogo" class="navbar-brand">
    <img src="https://i.postimg.cc/vH3zLvrj/icono.png" alt="Logo" class="navbar-logo">
    Café de Barrio
  </a>
  <div class="navbar-links">
    @if (auth.isLoggedIn()) {
      <a routerLink="/catalogo">Catálogo</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/productos">Admin Productos</a>
        <a routerLink="/admin/pedidos">Admin Pedidos</a>
      }
      <a routerLink="/carrito" class="carrito-btn">
        🛒 Carrito
        @if (carrito.cantidadTotal() > 0) {
          <span class="badge">{{ carrito.cantidadTotal() }}</span>
        }
      </a>
      <button class="btn-logout" (click)="auth.cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <a routerLink="/login">Iniciar sesión</a>
      <a routerLink="/registro" class="btn-registro">Registrarse</a>
    }
  </div>
</nav>
