<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div [class]="'toast toast-' + toast.tipo" (click)="toastService.eliminar(toast.id)">
      <span class="toast-icono">
        @if (toast.tipo === 'success') { ✓ }
        @if (toast.tipo === 'error') { ✕ }
        @if (toast.tipo === 'warning') { ⚠ }
      </span>
      {{ toast.mensaje }}
    </div>
  }
</div>
