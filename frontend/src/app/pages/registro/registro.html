<div class="auth-container">
  <div class="auth-card">
    <img src="https://i.postimg.cc/tgDm1HrZ/logooo.png" alt="Café de Barrio" class="auth-logo-img">

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <div class="campo">
      <label>Usuario</label>
      <input type="text" [value]="username()"
        (input)="username.set($any($event.target).value)"
        placeholder="Elige un usuario">
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" [value]="password()"
        (input)="password.set($any($event.target).value)"
        placeholder="Crea una contraseña">
    </div>
    <div class="campo">
      <label>Confirmar contraseña</label>
      <input type="password" [value]="confirmar()"
        (input)="confirmar.set($any($event.target).value)"
        placeholder="Repite la contraseña">
    </div>

    <button class="btn-auth" (click)="registrarse()" [disabled]="cargando()">
      @if (cargando()) { Registrando... } @else { Crear cuenta }
    </button>

    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
